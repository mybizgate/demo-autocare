<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="build-version" content="__BUILD_VERSION__">
  <meta name="author" content="Niagova">
  <title>Auto Care &amp; Services Template Showcase</title>
  <meta name="description" content="Compare four Auto Care &amp; Services website concepts in one showcase: Monarch, Aurelia, Obsidian and Precision.">
  <meta name="theme-color" content="#f6f6f3">
  <meta property="og:title" content="Auto Care &amp; Services Template Showcase">
  <meta property="og:image" content="04-precision/images/autocare-hero-ceramic-v3.webp">
  <link rel="canonical" href="https://demo-autocare.niagova.com/">
  <link rel="icon" href="favicon.ico">
  <link rel="stylesheet" href="index.css?v=__BUILD_VERSION__">
</head>
<body>
  <a class="skip-link" href="#templatePreview">Skip to website preview</a>

  <header class="showcase-bar" aria-label="Template preview controls">
    <div class="showcase-identity">
      <a class="showcase-logo" href="https://niagova.com/" target="_blank" rel="noopener"><img src="assets/niagova-logo.svg" alt="Niagova" width="118" height="28"></a>
      <span class="showcase-title">
        <strong>Auto Care &amp; Services concepts</strong>
        <small><span>Demo by Niagova</span> · <span id="previewStatus" aria-live="polite">Previewing Precision</span></small>
      </span>
    </div>

    <nav class="template-tabs" aria-label="Choose a website template">
      <button class="template-tab" type="button" data-template="monarch" aria-pressed="false"><span>01</span> Monarch</button>
      <button class="template-tab" type="button" data-template="aurelia" aria-pressed="false"><span>02</span> Aurelia</button>
      <button class="template-tab" type="button" data-template="obsidian" aria-pressed="false"><span>03</span> Obsidian</button>
      <button class="template-tab" type="button" data-template="precision" aria-pressed="true"><span>04</span> Precision</button>
    </nav>

    <div class="showcase-actions">
      <a class="open-template" id="openTemplate" href="04-precision/index.html" target="_blank" rel="noopener" aria-label="Open this template as a full page in a new tab">
        <span class="open-label">Open full page</span> <span aria-hidden="true">↗</span>
      </a>
      <a class="view-packages" href="https://niagova.com/#pricing" target="_blank" rel="noopener">View packages</a>
    </div>
  </header>

  <main class="preview-shell">
    <iframe id="templatePreview" name="templatePreview" src="04-precision/index.html" title="Precision car care website template preview"></iframe>
  </main>

  <noscript>
    <div class="no-script">
      JavaScript is needed for the template switcher. Open a template directly:
      <a href="01-monarch/index.html">Monarch</a>,
      <a href="02-aurelia/index.html">Aurelia</a>,
      <a href="03-obsidian/index.html">Obsidian</a> or
      <a href="04-precision/index.html">Precision</a>.
    </div>
  </noscript>

  <script src="index.js?v=__BUILD_VERSION__"></script>
</body>
</html>
